schema = 1

[device]
name = "Sony BRAVIA VU31 4K"
brand = "Sony"
model = "BRAVIA VU31 4K (BRAVIA_VU31_4K)"
platform = "googletv"
os = "Google TV 14"
firmware = "UKR1.240726.001"
stock_launcher = "com.google.android.apps.tv.launcherx"
notes = """
Imported from cleanyourtv (examples/sony-bravia-vu31, MIT, Gathin and contributors). Not yet verified with quietv on this device.
Realtek SoC, 2 GB RAM, India firmware. Unlike the MediaTek Sony sets it ships no Samba TV, Qterics or IDD agents.
Live TV and every HDMI and AV input play in com.android.tv, the inputs come from com.realtek.tv.passthrough.
Leave com.realtek.*, com.android.tv, sonysystemservice, smartui, m2.devicecontrolservice and ipcontrol alone.
The Input key opens smartui's menu system-wide, also with the stock launcher disabled.
USB debugging alone opens port 5555, no wireless debugging pairing is needed.
Remote app buttons: on one of three tested sets they stopped working once the stock launcher was disabled, because
com.realtek.advancesetting hands every launch to the stock launcher. YouTube (201, 202), Netflix (191) and Prime
Video (189) can be remapped by keycode. The SonyLIV and JioHotstar buttons never reach Android, only the stock
launcher brings them back.
com.sony.dtv.applicationdisabler re-enables com.sony.dtv.ecodashboard at every boot, so hide its tile instead.
Before disabling com.google.android.tungsten.setupwraith (quietv protects it) check which app owns the saved Wi-Fi
network: quietv shell "dumpsys wifi | grep -o 'cname=[^ ]*'". On the source TV it was android.uid.system.
With 2 GB the set still swaps after the debloat.
"""


schema = 1

[device]
name = "NVIDIA SHIELD TV Pro (2019)"
brand = "NVIDIA"
model = "P2897 (mdarcy)"
platform = "androidtv"
os = "Android TV 11"
firmware = "RQ1A.210105.003.7825230_4387.0822"
stock_launcher = "com.google.android.tvlauncher"
notes = """
Imported from cleanyourtv (examples/nvidia-shield-tv-pro-2019, MIT, Gathin and contributors). Not yet verified with quietv on this device.
Tested on SHIELD Experience 9.2.4, package names also checked on 9.2.2. The 2019 tube (P3430) and the 2015 and 2017 models
run the same software, so this is a starting point for them too. Check pm list packages first.
ADB: turn on Developer options > Network debugging. The Pro has no USB device port. Ethernet and Wi-Fi get different
addresses, so reserve an IP in the router.
Keep com.google.android.tvrecommendations enabled: without it the SHIELD TV phone app connects but every key press fails.
The default screensaver is Backdrop. Pick another screensaver before disabling it.
The remote's Netflix button is handled in firmware. Disabling Netflix does not free it.
A SHIELD Experience update can re-enable packages. Run quietv check afterwards.
No HDMI input and no tuner. For a network tuner keep Live Channels (com.google.android.tv).
Removing Play services, keychain or com.android.se has soft-bricked Shields. Never touch them.
"""


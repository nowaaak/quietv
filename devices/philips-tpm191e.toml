schema = 1

[device]
name = "Philips TPM191E (50PUS8505, 55OLED854, 65OLED804, 50PUS7354)"
brand = "Philips"
model = "TPM191E (PH9M_EA_5599)"
platform = "androidtv"
os = "Android TV 12"
firmware = "STT2.230526.001"
stock_launcher = "com.google.android.tvlauncher"
notes = """
Imported from cleanyourtv (examples/philips-tpm191e, MIT, Gathin and contributors). Not yet verified with quietv on this device.
TP Vision board, MediaTek mt5887, about 2 GB RAM. Some 2020 sets still run the Android 9 firmware PTT1.181130.001.
Vendor packages use the org.droidtv prefix. Leave org.droidtv.eum, nettvbrowser, menudataapp, nettvregistration,
playtv, channels, philipstvdrawer and tvsystemui alone.
The Freeview packages (uk.co.freeview.*, org.droidtv.freeviewplayers) are disabled at the factory, even on non-UK sets.
DTS Play-Fi (com.phorus.playfi.tv) re-enables itself at every boot, so it is not listed.
The firmware opens Live TV (org.droidtv.playtv) at every boot.
With the stock launcher disabled: a held Home press does nothing (Android sends it to the system FallbackHome), and on
some remotes the Settings button stops working (it sends scancode 357). SOURCES opens org.droidtv.channels and the
Philips Settings button org.droidtv.philipstvdrawer, both keep working.
The Netflix (scancode 632) and Rakuten TV (779) buttons do nothing once those apps are disabled.
OLED models draw a moving Philips logo over a still picture after a few minutes. Keys injected over ADB do not
dismiss it, a real remote key does.
"""


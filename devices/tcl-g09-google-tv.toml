schema = 1

[device]
name = "TCL Smart TV Pro (G09)"
brand = "TCL"
model = "Smart TV Pro (G09)"
platform = "googletv"
os = "Google TV (Android 12)"
firmware = "STT2.230203.001 AS24"
stock_launcher = "com.google.android.apps.tv.launcherx"
notes = """
Imported from cleanyourtv (examples/tcl-g09-google-tv, MIT, Gathin and contributors). Not yet verified with quietv on this device.
Amlogic T5M, 2 GB RAM, product G09_4K_GB. The source list was used on UK firmware AS24 in Brazil and India,
on a 55P71B Pro (AS23), on G09_4K_GB_32BIT (AS10) and on a 55V6C (G09_4K_GB_NF, AS24).
Keep launcherx enabled and let quietv install set up the Home redirect. With launcherx disabled the remote's gear,
Netflix, Prime Video and YouTube buttons do nothing, and key helpers that bring them back cost the volume key
auto-repeat. One owner also lost the volume beep for good after disabling launcherx.
com.tcl.partnercustomizer must stay: without it com.mediatek.tv.service crash-loops (cleanyourtv issue #2138).
The source list disables it, this list does not.
The setup wizard (setupwraith) can own the saved Wi-Fi network. Leave it enabled.
Firmware updates come through Play services, there is no TCL updater package.
TCL remote keys can be remapped through the global setting CustomKeyList (cleanyourtv issue #812).
HDMI and Live TV come out black in screenshots. Press Home first.
"""


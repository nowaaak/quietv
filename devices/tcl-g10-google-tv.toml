[[keep]]
id = "com.tcl.partnercustomizer"
reason = "com.mediatek.tv.service crash-loops without it (cleanyourtv issue #2138)"

[[keep]]
id = "com.google.android.tungsten.setupwraith"
reason = "setup wizard, can own the saved Wi-Fi network and claims Home when launcherx is disabled"

[[keep]]
id = "com.google.android.tv.remote.service"
reason = "the remote's mic button starts its voice service, phone remote apps pair through it"

[[keep]]

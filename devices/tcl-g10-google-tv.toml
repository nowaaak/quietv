schema = 1

[device]
name = "TCL 4K Google TV (G10)"
brand = "TCL"
model = "G10_4K_US_NF (G10)"
platform = "googletv"
os = "Google TV (Android 12)"
firmware = "STT2.230203.001"
stock_launcher = "com.google.android.apps.tv.launcherx"
notes = """
Imported from cleanyourtv (examples/tcl-g10-google-tv, MIT, Gathin and contributors). Not yet verified with quietv on this device.
Realtek RTD2875P, 2023 model year. The source names the product, not ro.product.model. The list was used on a US 55" set
(G10_4K_US_NF), a 55P6K in Spain and a 43P69K in the Netherlands (G10_4K_GB_NF_32BIT), a C69B (G10_4K_GB) and a 43T6C.
Samba TV ACR, com.tcl.logkit and com.tcl.ttvs ship disabled on some sets and enabled on others.
Keep launcherx enabled and let quietv install set up the Home redirect. With launcherx disabled the remote's
YouTube, Netflix, Prime Video and Web buttons do nothing, and the setup wizard (setupwraith) claims Home.
setupwraith can own the saved Wi-Fi network. Leave it enabled.
com.tcl.partnercustomizer must stay: without it com.mediatek.tv.service crash-loops (cleanyourtv issue #2138).
The source list disables it, this list does not.
com.google.android.tv.remote.service must stay for the remote's mic button.
Disabling dreamx leaves the screensaver setting pointing at it and removed the screensaver menu from Settings on the 43P69K.
TclAppBoot blocks apps from starting at boot until they have the APP_AUTO_START app-op.
TCL remote keys can be remapped through the global setting CustomKeyList (cleanyourtv issue #812).
HDMI and Live TV come out black in screenshots. Press Home first.
"""


schema = 1

[device]
name = "Sony BRAVIA 4K VH21 (EU)"
brand = "Sony"
model = "XR-55A80K (BRAVIA_VH21)"
platform = "googletv"
os = "Google TV 12"
firmware = "STT2.230505.001.S136"
stock_launcher = "com.google.android.apps.tv.launcherx"
notes = """
Imported from cleanyourtv (examples/sony-bravia-4k-vh21-eu, MIT, Gathin and contributors). Not yet verified with quietv on this device.
2022 OLED, MediaTek mt5895, 3 GB RAM, EU firmware. The EU preloads (ARD, All 4, ITV, My5, iPlayer, YouView,
HD+, YouTube Music) were already disabled at the factory on the source TV, so they are not listed.
Live TV is com.sony.dtv.tvx. Leave the com.sony.dtv.tvinput.* services, tvapi, sonysystemservice,
sonyvendorservice, imeproxy, settingsprovider, the system update packages, braviasync* and every com.mediatek.*
package alone: they drive HDMI, the tuner, the Input overlay, Bravia Sync, updates and the remote's app buttons.
The Netflix, YouTube, Prime Video and Disney+ buttons are routed by sonyvendorservice, so they keep working with
the stock launcher disabled. YouTube, Prime Video and Disney+ all send keycode 196 (scancodes 485, 490, 491):
remapping one of them needs the scancode, a keycode remap takes all three.
The Settings key does nothing once the stock launcher is disabled. The Input key opens Sony's own input overlay.
The source also disabled com.google.android.tungsten.setupwraith, which quietv protects. It owned the Wi-Fi network
saved during first setup on the source TV: forget and re-join that network before disabling it, or the TV drops off Wi-Fi.
"""


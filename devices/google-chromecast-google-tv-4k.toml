schema = 1

[device]
name = "Chromecast with Google TV (4K)"
brand = "Google"
model = "sabrina"
platform = "googletv"
os = "Google TV, Android 14"
firmware = "UTTC.250917.004"
stock_launcher = "com.google.android.apps.tv.launcherx"
notes = """
Imported from cleanyourtv (examples/google-chromecast-gtv-4k, MIT, Gathin and contributors). Not yet verified with quietv on this device.
2 GB RAM. A dongle: no HDMI inputs and no Live TV.
ADB on port 5555 stays closed until you pair once through Developer options > Wireless debugging
(quietv pair). Wireless debugging switches itself off at every reboot, and on Ethernet the toggle
flips straight back off, so pair over Wi-Fi.
setupwraith (the setup wizard) holds the Cast receiver's device credentials and can own a Wi-Fi
network saved during setup. Disabling it breaks casting from phones after the next reboot
("Untrusted device") and deletes that network. quietv protects it, so keep launcherx enabled and use
the Home redirect (the default of quietv install on Google TV). set-home-activity is ignored on this build.
With launcherx disabled the remote's YouTube (BUTTON_3, 190) and Netflix (BUTTON_4, 191) buttons do
nothing. cleanyourtv also saw the YouTube button do nothing with its own Home redirect. Not checked with quietv.
com.google.android.tvrecommendations and com.google.android.apps.education.cast2class ship disabled.
pm disable-user fails on them, leave them alone.
Before disabling dreamx and backdrop, run quietv screensaver on, or the screensaver setting points at
a disabled app.
"""

[[package]]
id = "com.google.android.feedback"
category = "telemetry"
tier = "recommended"

[[package]]
id = "com.android.tv.feedbackconsent"
category = "telemetry"
tier = "recommended"

[[package]]
id = "com.google.android.tv.remotecontrol.logging"
category = "telemetry"
tier = "recommended"
note = "remote usage logging"

[[package]]
id = "com.google.android.apps.tv.netoscope"
category = "telemetry"
tier = "recommended"
note = "network diagnostics reporting"

[[package]]
id = "com.google.android.federatedcompute"
category = "telemetry"
tier = "recommended"
note = "federated learning module. Re-enable if the Play Store or Assistant misbehave"

[[package]]
id = "com.google.android.ondevicepersonalization.services"
category = "telemetry"
tier = "recommended"
note = "Privacy Sandbox personalization module. Re-enable if the Play Store or Assistant misbehave"

[[package]]
id = "com.google.android.adservices.api"
category = "ads"
tier = "recommended"
note = "Privacy Sandbox ad services"

[[package]]
id = "com.google.android.ext.adservices.api"
category = "ads"
tier = "recommended"
note = "Privacy Sandbox ad services"

[[package]]
id = "com.google.android.play.games"
category = "preloaded"
tier = "recommended"

[[package]]
id = "com.android.printspooler"
category = "preloaded"
tier = "recommended"
note = "printing service"

[[package]]
id = "com.google.android.videos"
category = "preloaded"
tier = "advanced"
note = "Google TV / Play Movies, needed to watch purchased titles"

[[package]]
id = "com.google.android.marvin.talkback"
category = "preloaded"
tier = "advanced"
note = "TalkBack screen reader"

[[package]]
id = "com.google.android.apps.tv.dreamx"
category = "content"
tier = "advanced"
note = "Ambient mode screensaver. Run quietv screensaver on first"

[[package]]
id = "com.google.android.backdrop"
category = "content"
tier = "advanced"
note = "Ambient mode screensaver. Run quietv screensaver on first"

[[keep]]
id = "com.google.android.tungsten.setupwraith"
reason = "setup wizard, holds Wi-Fi and Cast credentials. Without it casting fails after a reboot and Wi-Fi saved during setup is deleted"

[[keep]]
id = "com.google.android.tv.dfuservice"
reason = "firmware updates for the remote"

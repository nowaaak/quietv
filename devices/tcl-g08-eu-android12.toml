[[keep]]
id = "com.tcl.partnercustomizer"
reason = "com.mediatek.tv.service crash-loops without it (cleanyourtv issue #2138)"

[[keep]]
id = "com.google.android.tungsten.setupwraith"
reason = "setup wizard, can own the saved Wi-Fi network and claims Home when launcherx is disabled"

[[keep]]
id = "com.tcl.suspension"
reason = "hosts the input panel, the remote's Source key does nothing without it"

[[keep]]
id = "com.tcl.interactive"
reason = "Live TV binds its service for source and HbbTV overlays, without it the TV input service logs errors at 10 Hz"

[[keep]]
id = "com.tcl.ttvs"
reason = "same chain as com.tcl.interactive, disabling it breaks the Live TV source overlays"

[[keep]]
id = "com.tcl.guard"
reason = "disabled, the system retries its memory manager service every 5 seconds"

[[keep]]
id = "com.tcl.autopair"
reason = "Bluetooth remote pairing, an unpaired remote cannot pair again without it"

[[keep]]
id = "com.tcl.tv"
reason = "Live TV and HDMI playback"

[[keep]]
id = "com.tcl.tvinput"
reason = "provides the HDMI and tuner inputs"

schema = 1

[device]
name = "TCL Smart TV Pro (G08, EU firmware)"
brand = "TCL"
model = "Smart TV Pro (G08)"
platform = "googletv"
os = "Google TV (Android 12)"
firmware = "STT2.221228.001 AS34"
stock_launcher = "com.google.android.apps.tv.launcherx"
notes = """
Imported from cleanyourtv (examples/tcl-g08-eu-android12, MIT, Gathin and contributors). Not yet verified with quietv on this device.
MediaTek G08 board, product G08_4K_GB, EU and UK firmware. The source list was used on a 75Q7C (AS36), a 50C805X1 (AS34) and a 55C7K.
Preloads differ by set and region, so some packages on this list may be missing on yours.
Keep launcherx enabled and let quietv install set up the Home redirect. With launcherx disabled the remote's Netflix,
Prime Video, YouTube and TCL buttons do nothing, and key helpers that bring them back cost the volume key auto-repeat.
Never disable com.tcl.suspension, com.tcl.interactive or com.tcl.ttvs on this firmware. The Source key stops opening
the input panel and the TV input service logs errors ten times a second.
com.tcl.partnercustomizer must stay: without it com.mediatek.tv.service crash-loops (cleanyourtv issue #2138).
The setup wizard (setupwraith) can own the saved Wi-Fi network. Leave it enabled.
TCL remote keys can be remapped through the global setting CustomKeyList (cleanyourtv issue #812).
HDMI and Live TV come out black in screenshots.
"""


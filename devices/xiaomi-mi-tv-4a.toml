schema = 1

[device]
name = "Xiaomi Mi TV 4A"
brand = "Xiaomi"
model = "MiTV-MOOQ1 (tarzan)"
platform = "androidtv"
os = "Android TV 10"
firmware = "QTG3.200305.006.2591"
stock_launcher = "com.google.android.tvlauncher"
notes = """
Also a good starting point for other Xiaomi and Redmi Android TVs with PatchWall.
Known quirk: default_input_method points at com.baidu.input, which is not installed, so no keyboard
appears in search fields. Fix: quietv shell ime set com.google.android.inputmethod.latin/com.android.inputmethod.latin.LatinIME
"""


[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quietv"
version = "0.5.1"
description = "Debloat Android TV, Google TV and Fire TV over ADB and install the quietv launcher."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "quietv contributors" }]
keywords = ["android-tv", "google-tv", "fire-tv", "debloat", "adb", "launcher"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = ["adb-shell>=0.4.4"]

[project.urls]
Homepage = "https://github.com/nowaaak/quietv"
Issues = "https://github.com/nowaaak/quietv/issues"

[project.scripts]
quietv = "quietv.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/quietv"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

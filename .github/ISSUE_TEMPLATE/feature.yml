name: Feature idea
description: Suggest something for the launcher or the CLI
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could quietv help?
  - type: checkboxes
    id: fit
    attributes:
      label: Project fit
      options:
        - label: This works on a TV with 1 GB of RAM and needs no feeds, ads or tracking
          required: true
